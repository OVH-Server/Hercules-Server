networks:
  ragnarok-net:
    name: ragnarok-net


services:
  hercule-db:
    image: mysql:8.0-bookworm
    restart: unless-stopped
    volumes:
      - ./:/home/hercuser/Hercules
      - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
      - ./check_script_end.sh:/check_script_end.sh
      - ./mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      SERVER_RENEWAL_MODE: PRERENEWAL
      CHECK_FILE: /var/lib/mysql/database_ready
    healthcheck:
          test: ["CMD", "/check_script_end.sh"]
          interval: 15s
          timeout: 5s
          retries: 50 
          start_period: 30s
    networks:
      ragnarok-net:
    # labels:
    #   - ragnarok-webserv-dashboard.show=true

  builder:
    build: ./docker-builder
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false 
      PACKETVER: 20200401
      # PACKETVER: 20250716
      ENABLE_RENEWAL_PACKET: "no" # yes or no
    command: ["/docker_start.sh"]

  login-server:
    build: ./docker-builder
    restart: unless-stopped
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false
      SERVER_TYPE: login-server
    depends_on:
      hercule-db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    ports:
      # - 6903:6903
      - ${LOGIN_SERVER_PORT}:${LOGIN_SERVER_PORT}
    command: ["/docker_start.sh"]
    networks:
      ragnarok-net:
    labels:
      - ragnarok-webserv-dashboard.show=true


  char-server:
    build: ./docker-builder
    restart: unless-stopped
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false
      SERVER_TYPE: char-server
    depends_on:
      hercule-db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    ports:
      # - 6123:6123
      - ${CHAR_SERVER_PORT}:${CHAR_SERVER_PORT}
    command: ["/docker_start.sh"]
    networks:
      ragnarok-net:
    labels:
      - ragnarok-webserv-dashboard.show=true

  map-server:
    build: ./docker-builder
    restart: unless-stopped
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false
      SERVER_TYPE: map-server
    depends_on:
      hercule-db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    ports:
      # - 5123:5123
      - ${MAP_SERVER_PORT}:${MAP_SERVER_PORT}
    command: ["/docker_start.sh"]
    networks:
      ragnarok-net:
    labels:
      - ragnarok-webserv-dashboard.show=true

  api-server:
    build: ./docker-builder
    restart: unless-stopped
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false
      SERVER_TYPE: api-server
    depends_on:
      hercule-db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    ports:
      # - 7123:7123
      - ${API_SERVER_PORT}:${API_SERVER_PORT}
    command: ["/docker_start.sh"]
    networks:
      ragnarok-net:
    labels:
      - ragnarok-webserv-dashboard.show=true

