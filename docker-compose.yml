services:
  hercule-db:
    image: mysql:8.0-bookworm
    volumes:
      - ./:/home/hercuser/Hercules
      - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
      - ./check_script_end.sh:/check_script_end.sh
    environment:
      MYSQL_ROOT_PASSWORD: root
      SERVER_RENEWAL_MODE: PRERENEWAL
      CHECK_FILE: /tmp/database_ready
    healthcheck:
          test: ["CMD", "/check_script_end.sh"]
          interval: 10s
          timeout: 5s
          retries: 5
          start_period: 30s


# export UID=$(id -u)
# export GID=$(id -g)
# docker-compose up
  
  builder:
    build: ./docker-builder
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: true
      PACKETVER: 20250716
      ENABLE_RENEWAL_PACKET: "no" # yes or no
    command: ["/docker_start.sh"]
    user: ubuntu

  login-server:
    build: ./docker-builder
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false
      SERVER_TYPE: login-server
    depends_on:
      hercule-db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    ports:
      - 6900:6900
    command: ["/docker_start.sh"]
    user: ubuntu

  char-server:
    build: ./docker-builder
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false
      SERVER_TYPE: char-server
    depends_on:
      hercule-db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    ports:
      - 6121:6121
    command: ["/docker_start.sh"]
    user: ubuntu

  map-server:
    build: ./docker-builder
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false
      SERVER_TYPE: map-server
    depends_on:
      hercule-db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    ports:
      - 5121:5121
    command: ["/docker_start.sh"]
    user: ubuntu

  api-server:
    build: ./docker-builder
    volumes:
      - ./:/home/hercuser/Hercules
      - ./docker_start.sh/:/docker_start.sh
    environment:
      COMPILE_SERVER: false
      SERVER_TYPE: api-server
    depends_on:
      hercule-db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully
    ports:
      - 7121:7121
    command: ["/docker_start.sh"]
    user: ubuntu


